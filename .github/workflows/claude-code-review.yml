name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This is the loop's independent-review phase (see CLAUDE.md).
          # Runs in a fresh runner with no access to whatever local
          # session wrote the code, per docs/VISION.md-driven scope checks.
          #
          # Without --allowedTools, Claude reviews in-process but every
          # gh/MCP comment attempt is denied (see permission_denials in
          # the Action log) and the check still goes green with no PR
          # output. Tools below are required for visible review output.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Follow the independent review protocol in
            .github/claude-review-instructions.md to review this pull
            request.

            You MUST leave visible GitHub output — never finish with
            only an internal summary:
            - Inline findings: mcp__github_inline_comment__create_inline_comment
              (pass confirmed: true)
            - Formal review verdict: gh pr review --approve OR
              gh pr review --request-changes --body "..." OR
              gh pr review --comment --body "..." (comment-only when
              there are non-blocking notes and nothing to block on)
            - Do not rely on the Action job log as the deliverable.

          claude_args: |
            --max-turns 20
            --allowedTools "Read,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(npm:*)"
