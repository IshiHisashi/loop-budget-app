name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This is the loop's independent-review phase (see CLAUDE.md).
          # Runs in a fresh runner with no access to whatever local
          # session wrote the code, per docs/VISION.md-driven scope checks.
          prompt: |
            Follow the independent review protocol in
            .github/claude-review-instructions.md to review pull request
            ${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

