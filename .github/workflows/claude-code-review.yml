name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This is the loop's independent-review phase (see CLAUDE.md).
          # Runs in a fresh runner with no access to whatever local
          # session wrote the code, per docs/VISION.md-driven scope checks.
          #
          # Without --allowedTools, Claude reviews in-process but every
          # gh/MCP comment attempt is denied (see permission_denials in
          # the Action log) and the check still goes green with no PR
          # output. Tools below are required for visible review output.
          #
          # claude-auto-address.yml pushes fix commits as claude[bot],
          # which re-triggers this workflow via `synchronize` — the
          # action refuses to run for a bot-triggered event unless
          # explicitly allowed. Same root cause/fix as claude-auto-
          # address.yml itself (see that file for the full story).
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Follow the independent review protocol in
            .github/claude-review-instructions.md to review this pull
            request.

            Hard constraints for this CI run:
            - Finish with a formal `gh pr review` BEFORE you run out of
              turns. Prefer a shorter correct review over a deep one that
              never posts.
            - Do NOT install dependencies or run npm/tests — trust the
              PR test plan / existing checks; review the diff only.
            - You MUST leave visible GitHub output:
              - Inline findings via
                mcp__github_inline_comment__create_inline_comment
                (pass confirmed: true)
              - Formal verdict: gh pr review --approve OR
                --request-changes OR --comment

          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr:*),Bash(gh issue:*),Bash(gh api:*)"
